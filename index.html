<!DOCTYPE html>
<html lang="en">
<head>
    <title>WebSharper Media Capabilities API Demo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%234f46e5'/%3E%3Cpath d='M5 4l7 4-7 4z' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" type="text/css" href="Content/WebSharper.MediaCapabilities.Sample.css" />
    <link rel="stylesheet" type="text/css" href="site.css" />
    <script type="module" src="Content/WebSharper.MediaCapabilities.Sample.head.js"></script>
</head>
<body>
    <main class="page">
        <header class="hero">
            <h1>Media Capabilities API Demo</h1>
            <p class="lede">
                Ask the browser whether it can decode a video configuration with the
                <a href="https://developer.mozilla.org/en-US/docs/Web/API/Media_Capabilities_API" target="_blank" rel="noreferrer">Media Capabilities API</a>.
            </p>
        </header>

        <section class="card">
            <h2>Video decoding</h2>
            <p class="hint">Checks <code>video/mp4; codecs=avc1.42E01E</code> at 1920×1080, 30 fps, 5 Mbps.</p>
            <div class="actions">
                <button class="btn btn-primary" ws-onclick="checkMedia">Check video support</button>
            </div>
            <p class="status" role="status">${status}</p>
            <dl class="readout">
                <dt>Supported</dt><dd>${supported}</dd>
                <dt>Smooth</dt><dd>${smooth}</dd>
                <dt>Power efficient</dt><dd>${powerEfficient}</dd>
            </dl>
        </section>
    </main>
    <script type="module" src="Content/WebSharper.MediaCapabilities.Sample.min.js"></script>
</body>
</html>
